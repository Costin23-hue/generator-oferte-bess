# Construiește automat aplicațiile pe serverele GitHub:
#   - Windows: Generator Oferte BESS.exe
#   - Mac:     Generator Oferte BESS.app (în arhiva .zip)
# Pornire: tab-ul "Actions" -> "Construieste aplicatiile" -> "Run workflow" (sau automat la fiecare modificare pe main).
# Rezultatul se descarcă de pe pagina rulării, secțiunea "Artifacts".
name: Construieste aplicatiile

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  construieste:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]      # macos-latest = Mac cu procesor Apple (M1/M2/M3/M4)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Versiuni fixe: pandas 2.3.3 e versiunea pe care politica de securitate Windows o lasă să ruleze
      - name: Instaleaza bibliotecile
        run: python -m pip install pyinstaller "pandas==2.3.3" openpyxl xlwings python-pptx

      - name: Construieste aplicatia
        run: python construieste_exe.py

      - name: Arhiveaza aplicatia Mac
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Generator Oferte BESS.app" "Generator Oferte BESS - Mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Generator Oferte BESS - ${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
